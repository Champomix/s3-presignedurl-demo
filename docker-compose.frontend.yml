# Front + storage, backend lancé hors Docker (cd backend && npm start)
services:
  backend:
    profiles: ["disabled"]
  gateway:
    # Libère le port 3001 pour le backend lancé sur l'hôte
    ports: !override
      - "9000:9000"
  frontend:
    environment:
      BACKEND_URL: http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
