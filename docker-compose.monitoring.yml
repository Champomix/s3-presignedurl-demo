# Supervision RustFS : OTLP -> OpenTelemetry Collector -> Prometheus -> Grafana
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
# Grafana : http://localhost:3000 (GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD, admin/admin par defaut)
# Prometheus : http://localhost:9090
services:
  rustfs:
    environment:
      RUSTFS_OBS_ENDPOINT: http://otel-collector:4318
      RUSTFS_OBS_METER_INTERVAL: "15"
      RUSTFS_METRICS_BUCKET_INTERVAL_SEC: "15"
      RUSTFS_METRICS_CLUSTER_INTERVAL_SEC: "15"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otel-collector.yaml:ro
    networks:
      - s3-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - otel-collector
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - s3-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - s3-net

volumes:
  prometheus-data:
  grafana-data:
