# Template : ${BACKEND_URL} est substitué au démarrage par l'image nginx officielle
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
