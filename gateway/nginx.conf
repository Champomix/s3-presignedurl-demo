# API S3 exposée sur localhost:9000 pour le navigateur ET le backend (network_mode: service:gateway)

# $uri sans query string : la signature des URL présignées ne doit jamais apparaître dans les logs
log_format no_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 9000;
    access_log /var/log/nginx/access.log no_query;

    client_max_body_size 0;
    # Transmission en flux : sans ça, la progression d'upload côté navigateur est faussée
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        # Le Host signé (localhost:9000) doit arriver intact à RustFS
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_pass http://rustfs:9000;
    }
}
